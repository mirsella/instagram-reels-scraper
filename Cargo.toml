[package]
name = "instagram-reels-scraper"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
chrono = "0.4.31"
dotenvy = "0.15.7"
env_logger = "0.10.1"
envy = "0.4.2"
fs_extra = "1.3.0"
headless_chrome = { git = "https://github.com/mirsella/rust-headless-chrome", features = [
  "fetch",
] }
log = "0.4.20"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
tempfile = "3.8.1"
